# Daily trigger for Carnival's automated Slack nudges.
#
# The app has no in-process scheduler (standalone container, possibly
# replicated), so this workflow calls POST /api/cron/nudges once a day. The
# route itself enforces every rail: dry run unless NUDGES_ENABLED=true on the
# server, deadline stop, per-user cooldowns, per-run cap.
#
# Repository secrets: CARNIVAL_APP_URL (e.g. https://carnival.hackclub.com)
# and CARNIVAL_CRON_SECRET (same value as the app's CRON_SECRET).
name: Automated nudges

on:
  schedule:
    # 16:00 UTC daily (late morning in the Americas, evening in Europe/Asia).
    # GitHub may delay scheduled runs by several minutes.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, send nothing"
        type: boolean
        default: true
      max:
        description: "Cap for this run (cannot exceed NUDGES_MAX_PER_RUN)"
        type: string
        default: ""

concurrency:
  group: automated-nudges
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/cron/nudges
        env:
          APP_URL: ${{ secrets.CARNIVAL_APP_URL }}
          CRON_SECRET: ${{ secrets.CARNIVAL_CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          MAX: ${{ inputs.max }}
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CARNIVAL_APP_URL / CARNIVAL_CRON_SECRET secrets are not set" >&2
            exit 1
          fi
          query=""
          [ "$DRY_RUN" = "true" ] && query="dryRun=1"
          if [ -n "$MAX" ]; then query="${query:+$query&}max=$MAX"; fi
          url="${APP_URL%/}/api/cron/nudges${query:+?$query}"
          echo "POST $url"
          response=$(curl --silent --show-error --fail-with-body --max-time 540 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$url")
          echo "$response" | jq '{dryRun, sendingEnabled, slackConfigured, daysLeft, maxSends,
            candidatesByKind, plannedByKind, skippedByReason,
            sent: (.sent | length), failed: (.failed | length)}'
          failed=$(echo "$response" | jq '.failed | length')
          if [ "$failed" != "0" ]; then
            echo "::warning::$failed nudge(s) failed to send; see server logs"
          fi
